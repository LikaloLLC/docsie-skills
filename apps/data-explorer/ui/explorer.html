<!doctype html>
<html lang="en" data-theme="light" data-mode="inline">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Explorer</title>
<style>
:root{--paper:#F7F3EC;--paper-2:#F1EBE1;--surface:#FFFFFF;--sunk:#EEE7DC;--line:#E6DED1;--line-2:#D8CDBC;--ink:#1D1915;--ink-2:#4B443C;--muted:#736859;--faint:#B4A999;--ember:#E4532C;--ember-hover:#D94A24;--ember-ink:#B23D1B;--ember-wash:#FCEAE2;--ember-line:#F3C3B1;--live:#2F7A57;--danger:#B42318;--danger-wash:#FDECEA;--danger-line:#F5CFCB;--draft:#8A6110;--draft-wash:#F8EED6;--focus:rgba(228,83,44,.38);--grid:#EEE7DC;--baseline:#CDBFAA;--band:rgba(214,203,186,.30);--row-hover:#FFFBF5;--tip-bg:#1D1915;--tip-ink:#FFFFFF;--tip-muted:#CDBFAE;--hover:rgba(255,255,255,.7);--shadow-1:0 1px 0 rgba(40,25,10,.03),0 10px 30px -18px rgba(60,35,15,.35);--shadow-2:0 1px 0 rgba(40,25,10,.04),0 16px 40px -18px rgba(50,30,10,.45);--f-display:Fraunces,Georgia,'Times New Roman',serif;--f-ui:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
[data-theme=dark]{--paper:#171310;--paper-2:#1D1915;--surface:#24201B;--sunk:#2F2923;--line:#37302A;--line-2:#4A4137;--ink:#F3EDE4;--ink-2:#D3C9BC;--muted:#A89B8B;--faint:#6F655A;--ember:#E4532C;--ember-hover:#EE6540;--ember-ink:#F49A79;--ember-wash:#3A2219;--ember-line:#6A3524;--live:#6FC39A;--danger:#F08A80;--danger-wash:#3A1D1A;--danger-line:#6A2E28;--draft:#E0B357;--draft-wash:#382C14;--focus:rgba(240,113,74,.55);--grid:#332C26;--baseline:#5A4F44;--band:rgba(255,240,220,.06);--row-hover:#2A251F;--tip-bg:#F3EDE4;--tip-ink:#1D1915;--tip-muted:#5E554B;--hover:rgba(255,255,255,.05);--shadow-1:0 1px 0 rgba(0,0,0,.2),0 10px 30px -18px rgba(0,0,0,.7);--shadow-2:0 1px 0 rgba(0,0,0,.25),0 16px 40px -18px rgba(0,0,0,.85);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper)}
body{font:400 13px/1.45 var(--f-ui);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus{outline:none}
:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)!important}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:15px;height:15px}.i.xs{width:12px;height:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.ov{font:600 10.5px/1.3 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#app{height:var(--app-h,700px);display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--paper)}
[data-mode=fullscreen] #app{height:100vh}
/* header */
.hdr{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);min-height:58px}
.hdr-t{flex:1;min-width:0}
.hdr-t h1{margin:0;font:600 16.5px/1.25 var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-m{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-m .dot{width:3px;height:3px;border-radius:50%;background:var(--faint);flex:none}
.flag{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;background:var(--draft-wash);color:var(--draft);font-size:11px;font-weight:600}
.hdr-a{display:flex;align-items:center;gap:6px;flex:none}
.btn{height:32px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:12.5px;white-space:nowrap;color:var(--ink);box-shadow:0 1px 0 rgba(40,25,10,.04);transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#fff;box-shadow:0 1px 0 var(--ember-ink),0 6px 14px -8px rgba(228,83,44,.8)}
.btn.primary:hover{background:var(--ember-hover)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.sm{height:28px;padding:0 9px;font-size:12px;gap:5px}
.btn.icon{width:32px;padding:0}
.btn.sm.icon{width:28px;padding:0}
.btn.on{border-color:var(--ember-line);color:var(--ember-ink);background:var(--ember-wash)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .spin{width:12px;height:12px}
/* layout */
.body{flex:1;min-height:0;display:grid;grid-template-columns:176px minmax(0,1fr);position:relative}
[data-mode=fullscreen] .body{grid-template-columns:232px minmax(0,1fr)}
.body.fc{grid-template-columns:minmax(0,1fr)}
.body.fc .fields{display:none}
.fields{background:var(--paper-2);border-right:1px solid var(--line);overflow:auto;min-height:0;padding:10px 6px 14px 10px}
.main{display:flex;flex-direction:column;min-height:0;min-width:0;padding:10px 12px 12px;gap:8px}
/* fields panel */
.fp-h{display:flex;align-items:center;gap:6px;padding:0 0 6px 4px}
.fp-h .n{font:500 10.5px var(--f-mono);color:var(--muted)}
.fp-h .btn{margin-left:auto}
.fp-s{position:relative;margin:2px 0 4px}
.fp-s .i{position:absolute;left:8px;top:7px;color:var(--muted)}
.fp-s input{padding-left:28px}
.fp-g{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 4px}
.fld{display:flex;align-items:center;border-radius:7px;position:relative}
.fld:hover{background:var(--hover)}
.fld-b{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:28px;padding:0 4px 0 4px;border-radius:7px;font-size:12.5px;color:var(--ink-2);cursor:grab;user-select:none}
.fld-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld.used .fld-t{color:var(--ink);font-weight:600}
.fld.used::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--ember)}
.fld-m{width:24px;height:24px;flex:none;border:0;background:transparent;border-radius:6px;color:var(--muted);display:grid;place-items:center;opacity:0}
.fld:hover .fld-m,.fld-m:focus-visible,.fld-m[aria-expanded=true]{opacity:1}
.fld-m:hover{background:var(--sunk);color:var(--ink)}
.fp-e{padding:8px 6px;color:var(--muted);font-size:12px}
.fp-hint{margin:12px 4px 0;padding:8px 9px;border-radius:8px;border:1px dashed var(--line-2);color:var(--muted);font-size:11.5px;line-height:1.4}
.fields.drop-rm{background:var(--danger-wash)}
.gl{width:22px;height:16px;flex:none;display:inline-grid;place-items:center;border-radius:4px;font:600 9px/1 var(--f-mono);color:var(--ink-2);background:var(--sunk);letter-spacing:-.03em}
.gl .i{width:11px;height:11px;stroke-width:2}
.gl-number{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
/* shelves */
.shelves{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;flex:none}
.shelf{display:flex;align-items:flex-start;min-height:36px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 3px 3px 0;min-width:0}
.sh-l{flex:none;width:76px;display:flex;align-items:center;height:28px;padding:0 6px 0 11px;color:var(--muted);font:600 10px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;border-right:1px solid var(--line);margin-right:4px}
.sh-z{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px;min-height:28px;align-items:center;border-radius:7px;padding:0 2px;position:relative}
.sh-ph{font-size:12px;color:var(--muted);padding:0 6px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-dragging .sh-z{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line-2)}
.sh-z.over{background:var(--ember-wash)!important;box-shadow:inset 0 0 0 1.5px var(--ember)!important}
.sh-z.ins-end::after{content:"";width:2px;height:22px;border-radius:2px;background:var(--ember)}
.pill{display:inline-flex;align-items:stretch;height:26px;max-width:100%;min-width:0;border-radius:7px;background:var(--paper);border:1px solid var(--line-2);color:var(--ink);font-size:12px;font-weight:600;position:relative;cursor:grab;user-select:none}
.pill.pv{background:var(--ember-wash);border-color:var(--ember-line);color:var(--ember-ink)}
.pill.pv .gl{background:transparent;box-shadow:inset 0 0 0 1px var(--ember-line);color:var(--ember-ink)}
.pill.pf .pl-b{padding-left:9px}
.pill.pf.on{border-color:var(--ink-2)}
.pill.drag-src{opacity:.35}
.pill.ins-before::before{content:"";position:absolute;left:-4px;top:1px;bottom:1px;width:2px;border-radius:2px;background:var(--ember)}
.pl-b{display:inline-flex;align-items:center;gap:6px;min-width:0;padding:0 2px 0 4px;border-radius:6px 0 0 6px;cursor:inherit}
.pl-b:hover{background:rgba(0,0,0,.035)}
.pl-b .i.xs{opacity:.6;width:10px;height:10px}
.pl-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.pl-g{font:500 10px/1 var(--f-mono);padding:3px 5px;border-radius:4px;background:var(--sunk);color:var(--ink-2);white-space:nowrap;text-transform:uppercase;letter-spacing:.02em}
.pill.pv .pl-g{background:rgba(255,255,255,.55);color:var(--ember-ink)}
[data-theme=dark] .pill.pv .pl-g{background:rgba(0,0,0,.25)}
.pl-x{width:22px;flex:none;border:0;background:transparent;color:inherit;opacity:.55;display:grid;place-items:center;border-radius:0 6px 6px 0}
.pl-x:hover{opacity:1;background:rgba(0,0,0,.06)}
/* toolbar */
.toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex:none}
.toolbar .sp{flex:1}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--sunk);gap:2px}
.seg button{border:0;background:transparent;height:26px;padding:0 7px;border-radius:7px;display:inline-flex;align-items:center;gap:5px;color:var(--ink-2);font-weight:500;font-size:12px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(40,25,10,.14);font-weight:600}
.seg button.on .i{color:var(--ember)}
.seg.small button{height:24px;font-size:11.5px;padding:0 7px}
/* kpis */
.kpis{display:flex;gap:8px;overflow-x:auto;flex:none;scrollbar-width:none}
.kpis::-webkit-scrollbar{display:none}
.kpi{flex:1 1 0;min-width:118px;max-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px 7px}
.kpi-l{font:600 10px/1.3 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v{font:600 18px/1.25 var(--f-ui);letter-spacing:-.01em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v small{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:0;margin-left:4px}
.kpi.rows{flex:0 1 auto;min-width:104px;background:transparent}
.kpi.more{flex:0 0 auto;min-width:0;display:grid;place-items:center;color:var(--muted);font-size:12px}
/* viz */
.viz{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-1);overflow:hidden;position:relative}
.vz-h{display:flex;align-items:center;gap:6px 14px;padding:10px 14px 4px;flex-wrap:wrap;flex:none}
.vz-t{font:600 14px/1.3 var(--f-display);letter-spacing:-.005em;min-width:0;flex:1 1 220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11.5px;color:var(--ink-2);max-height:40px;overflow:auto}
.lg{display:inline-flex;align-items:center;gap:6px;max-width:170px;white-space:nowrap}
.lg span{overflow:hidden;text-overflow:ellipsis}
.lg i{width:10px;height:10px;border-radius:2px;flex:none}
.lg i.ln{height:2.5px;width:14px;border-radius:2px}
.heat-lg{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.heat-lg b{display:inline-block;width:96px;height:8px;border-radius:4px}
.vz-n{padding:0 14px 4px;font-size:11.5px;color:var(--muted);display:flex;gap:2px 14px;flex-wrap:wrap;flex:none}
.vz-n span{display:inline-flex;align-items:center;gap:5px}
.vz-b{flex:1;min-height:0;overflow:auto;position:relative}
.vz-b.more-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 40px),transparent)}
.vz-b.ch{overflow-x:hidden;padding:0 12px 6px 14px}
.vz-b:focus-visible{box-shadow:inset 0 0 0 2px var(--focus)!important}
.vz-e{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:20px}
.vz-e h3{margin:6px 0 0;font:600 16px/1.3 var(--f-display)}
.vz-e p{margin:0 0 6px;color:var(--muted);font-size:12.5px;max-width:340px}
.lnk{border:0;background:transparent;color:var(--ember-ink);font-weight:600;font-size:11.5px;padding:1px 4px;border-radius:5px}
.lnk:hover{background:var(--ember-wash)}
/* chart */
svg.chart{display:block}
svg.chart text{font-family:var(--f-ui);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none}
svg.chart text.cl{fill:var(--ink-2)}
svg.chart text.vl{fill:var(--ink-2);font-weight:600;font-size:10.5px}
svg.chart text.at{font-weight:600;fill:var(--muted)}
svg.chart .gr{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
svg.chart .bl{stroke:var(--baseline);stroke-width:1;shape-rendering:crispEdges}
svg.chart .hl{fill:var(--band)}
svg.chart .xh{stroke:var(--baseline);stroke-width:1}
svg.chart .ring{stroke:var(--surface);stroke-width:2}
svg.chart .bar{transition:opacity .12s}
svg.chart .sa{stroke:var(--surface);stroke-width:1.5}
svg.chart .dn,svg.chart .dot{stroke:var(--surface);stroke-width:2}
svg.chart .dot{stroke-width:1.5}
svg.chart text.dt{font:600 22px var(--f-ui);fill:var(--ink);letter-spacing:-.01em}
svg.chart text.pc{font:500 11px var(--f-mono);fill:var(--ink-2)}
.lg i.dt{border-radius:50%;width:9px;height:9px}
.seg button .lbl{display:none}
.seg .mo{padding:0 5px 0 7px}
@media (min-width:900px){.seg button.on .lbl{display:inline}}
@media (max-width:1279px){.seg .x2{display:none}}
@media (min-width:1280px){.seg .mo{display:none}}
svg.chart.dim .bar{opacity:.55}
svg.chart.dim .bar.hot{opacity:1}
/* table */
table.pv{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.pv th,.pv td{padding:0 9px;height:28px;white-space:nowrap;border-bottom:1px solid var(--line);text-align:left;background:var(--surface)}
.pv thead th{position:sticky;top:0;z-index:2;height:30px;font:600 10.5px/1.2 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line-2);max-width:220px;overflow:hidden;text-overflow:ellipsis}
.pv thead th.mh,.pv thead th.vh{text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink);text-align:right;font-weight:600}
.pv thead th.vh{font-size:11.5px;color:var(--ink-2);font-weight:500}
.pv thead th.ch{text-align:right;color:var(--muted)}
.pv td.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.pv td.nil{color:var(--faint)}
.pv th.rl{font-weight:500;color:var(--ink);max-width:240px;overflow:hidden;text-overflow:ellipsis}
.pv .s0{position:sticky;left:0;z-index:1}
.pv thead .s0{z-index:3}
.pv .tc{box-shadow:inset 1px 0 0 var(--line-2);font-weight:600}
.pv:not(.heat) tbody tr:hover td,.pv:not(.heat) tbody tr:hover th{background:var(--row-hover)}
.pv tr.sub th,.pv tr.sub td{background:var(--paper);font-weight:600}
.pv tr.gt th,.pv tr.gt td{position:sticky;bottom:0;background:var(--paper-2);font-weight:700;border-top:1px solid var(--line-2);border-bottom:0;z-index:1}
.pv tr.gt .s0{z-index:2}
.pv.heat td.hc{border-bottom-color:var(--surface);box-shadow:inset -1px 0 0 var(--surface)}
/* popovers */
.pop{position:fixed;z-index:70;max-height:calc(100vh - 16px);overflow:auto;border-radius:12px;box-shadow:var(--shadow-2)}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;min-width:208px}
.mi{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 9px 0 6px;border:0;border-radius:7px;background:transparent;font-size:12.5px;color:var(--ink);text-align:left}
.mi:hover,.mi:focus-visible{background:var(--sunk)}
.mi:focus-visible{box-shadow:inset 0 0 0 2px var(--focus)!important}
.mi .ck{width:14px;display:grid;place-items:center;color:var(--ember);flex:none}
.mi kbd{margin-left:auto;font:500 10px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
.mi.danger{color:var(--danger)}
.mi[disabled]{opacity:.4;pointer-events:none}
.mh{font:600 10px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:7px 9px 3px 28px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.input{height:30px;width:100%;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;color:var(--ink)}
.input::placeholder{color:var(--muted)}
.input:focus{border-color:var(--ember);box-shadow:0 0 0 3px var(--focus)}
.fe{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:284px;display:flex;flex-direction:column}
.fe-h{padding:12px 14px 8px;display:flex;align-items:baseline;gap:8px}
.fe-h b{font:600 14.5px/1.2 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fe-h span{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.fe-g{padding:0 12px 8px}
.fe-s{padding:0 12px 6px}
.fe-a{display:flex;align-items:center;gap:2px;padding:0 8px 6px}
.fe-a .n{margin-left:auto;font:500 10.5px var(--f-mono);color:var(--muted);padding-right:4px}
.fe-l{overflow:auto;padding:4px 6px 6px;border-top:1px solid var(--line);max-height:236px;min-height:48px}
.ckr{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;font-size:12.5px;cursor:pointer;min-width:0}
.ckr:hover{background:var(--sunk)}
.ckr input{accent-color:var(--ink);width:15px;height:15px;margin:0;flex:none}
.ckr .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ckr .c{margin-left:auto;font:500 10.5px var(--f-mono);color:var(--muted);padding-left:8px}
.fe-more{padding:6px 8px;font-size:11.5px;color:var(--muted)}
.fe-r{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 12px 12px}
.fe-r label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.fe-f{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 8px;border-top:1px solid var(--line);background:var(--paper);border-radius:0 0 12px 12px}
.fe-f .sp{flex:1}
.lnk.danger{color:var(--danger)}
.lnk.danger:hover{background:var(--danger-wash)}
/* tooltip */
.tt{position:fixed;z-index:80;pointer-events:none;background:var(--tip-bg);color:var(--tip-ink);border-radius:8px;padding:7px 10px 8px;font-size:12px;box-shadow:var(--shadow-2);max-width:300px;min-width:130px;left:0;top:0}
.tt[hidden]{display:none}
.tt-h{font-size:11px;color:var(--tip-muted);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-r{display:flex;align-items:center;gap:8px;line-height:1.6;white-space:nowrap}
.tt-r i{width:12px;height:3px;border-radius:2px;flex:none}
.tt-r b{font-weight:600;font-variant-numeric:tabular-nums}
.tt-r span{color:var(--tip-muted);overflow:hidden;text-overflow:ellipsis}
.tt-r.hot span{color:var(--tip-ink)}
.tt-r.tot{border-top:1px solid rgba(128,128,128,.35);margin-top:3px;padding-top:2px}
/* toasts */
.toasts{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60;pointer-events:none;width:max-content;max-width:calc(100% - 24px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--tip-bg);color:var(--tip-ink);padding:8px 8px 8px 12px;border-radius:11px;box-shadow:var(--shadow-2);font-size:12.5px;max-width:100%}
.toast .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.ok .i{color:#7FD1A8}
[data-theme=dark] .toast.ok .i{color:var(--live)}
.toast.error{background:var(--danger-wash);color:var(--danger);border:1px solid var(--danger-line)}
.toast.error .tx{white-space:normal}
.toast .tb{border:0;background:transparent;color:#FFB394;font-weight:600;font-size:12px;padding:4px 6px;border-radius:6px}
[data-theme=dark] .toast .tb{color:var(--ember-ink)}
.toast.error .tb{color:var(--danger);text-decoration:underline}
.toast .tx-x{border:0;background:transparent;color:inherit;opacity:.6;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;flex:none}
.toast .tx-x:hover{opacity:1}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
/* states */
.state{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.state[hidden],.body[hidden]{display:none}
.state-c{max-width:400px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.state-c h2{margin:4px 0 0;font:600 18px/1.3 var(--f-display);letter-spacing:-.01em}
.state-c p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
.state-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--sunk);color:var(--ink-2)}
.state-ic .i{width:22px;height:22px}
.state-ic.err{background:var(--danger-wash);color:var(--danger)}
.state-c pre{margin:4px 0 0;font:11px/1.45 var(--f-mono);background:var(--paper-2);border:1px solid var(--line);padding:8px 10px;border-radius:8px;max-width:100%;white-space:pre-wrap;word-break:break-word;color:var(--ink-2);text-align:left;max-height:120px;overflow:auto}
.state-c .btn{margin-top:6px}
.pick{width:100%;max-height:280px;overflow:auto;display:flex;flex-direction:column;gap:4px;margin-top:6px;text-align:left}
.pick-i{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.pick-i:hover{border-color:var(--faint);background:var(--hover)}
.pick-i .i{grid-row:span 2;color:var(--ink-2)}
.pick-t{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-m{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-h{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 2px 0}
.skel{display:flex;gap:6px;align-items:flex-end;height:34px;margin-bottom:4px}
.skel i{width:9px;border-radius:3px 3px 0 0;background:var(--line-2);animation:pulse 1.2s ease-in-out infinite}
.skel i:nth-child(2){animation-delay:.15s}.skel i:nth-child(3){animation-delay:.3s}.skel i:nth-child(4){animation-delay:.45s}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.spin,.skel i{animation-duration:3s}}
@media (max-width:900px){.toolbar .lbl,.hdr .lbl-x{display:none}}
@media (min-width:1280px){.shelves{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:620px){.body{grid-template-columns:minmax(0,1fr)}.body:not(.fc) .fields{position:absolute;z-index:40;left:0;top:0;bottom:0;width:236px;box-shadow:var(--shadow-2)}.shelves{grid-template-columns:minmax(0,1fr)}.hdr .lbl-r{display:none}}

	}
	if (res.nc && res.cols.length >= 2) {
		var c0 = res.cd[0], cm = res.cols.map((c) => { return {label: c.labels.join(' \u00b7 '), v: pick(res.colT.get(c.key), 0)}; }).filter((x) => x.v != null).sort((a, b) => b.v - a.v);
		if (cm.length >= 2) facts.push('Across ' + c0.title + ', ' + cm[0].label + ' leads with ' + fm(cm[0].v) + share(cm[0].v) + '; ' + cm[cm.length - 1].label + ' is lowest at ' + fm(cm[cm.length - 1].v) + share(cm[cm.length - 1].v) + '.');
	}
	if (res.topInfo) facts.push('Only the top ' + res.topInfo.n + ' of ' + fmtInt(res.topInfo.of) + ' ' + res.rd[0].title + ' values are included.');
	return facts.slice(0, 6);
}
function reportText() {
	var res = ensureResult(), ds = S.dataset, t = exportTable(res, 200);
	if (res.nv === 1 && res.nc) { var suf = ' \u00b7 ' + res.vs[0].label; t.columns = t.columns.map((c) => c.kind === 'measure' && c.label.slice(-suf.length) === suf ? Object.assign({}, c, {label: c.label.slice(0, -suf.length)}) : c); }
	var build = (maxRows) => {
		var vals = res.vs.map((v) => v.label).join(', ') || 'row counts';
		var dn = (d) => d.title + (d.grain && d.title.toLowerCase() !== d.grain ? ' (by ' + d.grain + ')' : '');
		var rd = res.rd.map(dn).join(' > '), cd = res.cd.map(dn).join(' > ');
		var view = vals + (rd ? ' by ' + rd : '') + (cd ? (rd ? ' and ' : ' by ') + cd : '');
		var head = 'Dataset: ' + (ds.title || 'Untitled dataset') + ' (' + fmtInt(res.n) + ' rows after filters' + (S.truncated ? '; loaded ' + fmtInt(S.data.length) + ' of ' + fmtInt(S.totalRows) + ' rows' : '') + ')' + (ds.source ? ', source: ' + ds.source : '') + '. View: ' + view + '; filters: ' + (filtersText() || 'none') + (res.topInfo ? '; top ' + res.topInfo.n + ' ' + res.rd[0].title + ' by ' + res.vs[0].label : '') + '.';
		return ['Write an analytical report from this Data Explorer view and export it as a DOCX with the workspace template. '
			+ 'Write the report yourself in Markdown (title, summary, key findings, the table, what to watch), using only these numbers, '
			+ 'then call export_document with output_format "docx", the Markdown as content and the report title. '
			+ 'Do not start a long-form generation job.', head, '', markdownTable(t, maxRows, 10), '', 'Key facts:'].concat(keyFacts(res).map((f) => '- ' + f)).join('\n');
	};
	var text = build(40);
	[25, 15, 8, 3].forEach((n) => { if (text.length > 6000) text = build(n); });
	if (text.length > 6000) text = text.slice(0, 5990) + '\u2026';
	return text;
}
async function doReport() {
	if (S.status !== 'ready' || S.busy.report) return;
	if (!S.view.values.length) { toast('info', 'Add a measure to Values before writing a report.', {id: 'hint'}); return; }
	var text = reportText();
	S.busy.report = true; renderHeader();
	toast('progress', 'Sending the brief to Docsie\u2026', {id: 'report'});
	try {
		var r = await request('ui/message', {role: 'user', content: {type: 'text', text: text}}, 30000);
		if (r && r.isError) throw new Error(textOf(r) || 'Docsie didn\u2019t accept the message.');
		toast('ok', 'Sent to Docsie \u2014 the report request is in the chat.', {id: 'report', ms: 6000});
	} catch (e) {
		toast('error', 'Couldn\u2019t send the brief: ' + (e.message || e), {id: 'report', action: {label: 'Try again', act: 'report'}});
	} finally { S.busy.report = false; renderHeader(); }
}

/* ================= boot ================= */
async function init() {
	S.initFailed = false;
	if (S.status === 'error' && !S.dataset) S.status = 'connecting';
	render();
	try {
		var r = await request('ui/initialize', {protocolVersion: PROTOCOL, appInfo: {name: 'docsie-data-explorer', version: '1.0.0'}, appCapabilities: {availableDisplayModes: ['inline', 'fullscreen']}}, 20000);
		r = r || {};
		S.hostInfo = r.hostInfo || null; S.hostCaps = r.hostCapabilities || null;
		var hc = r.hostContext && typeof r.hostContext === 'object' ? r.hostContext : {};
		S.savedState = hc.docsieViewState;
		applyContext(hc);
		if (S.status === 'ready' && !S.userChanged) { var rv = applySavedState(); if (rv) { S.view = rv; S.lastFirst = rv.rows[0]; } }
		notify('ui/notifications/initialized');
		S.inited = true;
		if (S.status === 'connecting') S.status = 'waiting';
		requestAnimationFrame(reportSize);
	} catch (e) {
		if (S.status === 'connecting' || S.status === 'waiting') { S.status = 'error'; S.initFailed = true; S.msg = 'Couldn\u2019t connect to Docsie'; S.detail = e.message || String(e); }
	}
	render();
}
sizeApp();
init();
})();
</script>
